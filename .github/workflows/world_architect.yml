name: Antigravity World Architect & Nano Banana Story Generator

on:
  workflow_dispatch:       # Dipicu otomatis oleh cron-job.org (POST API) atau manual via Actions tab
  # schedule:
  #   - cron: '*/30 * * * *' # Dinonaktifkan: cron GitHub Actions sering delay 1-3 jam, digantikan cron-job.org
  push:
    branches: [main]       # Verifikasi & jalankan saat ada update ke main

jobs:
  world-architect:
    name: Generate Story, Quest & Cover Image (Nano Banana)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Dependencies
        run: |
          npm install --legacy-peer-deps || npm install --force

      - name: 🌌 Jalankan Antigravity World Architect & Nano Banana Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
        run: |
          node scripts/run_antigravity_agent.js

      - name: 📋 Publikasikan Ringkasan Cerita Baru ke GitHub Actions
        if: always()
        run: |
          echo "## 🌌 Laporan Rilis Cerita Baru (AetherMaster AI)" >> $GITHUB_STEP_SUMMARY
          echo "Waktu Server: $(date -u)" >> $GITHUB_STEP_SUMMARY
          if [ -f logs/latest_agent_report.md ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            cat logs/latest_agent_report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: 📁 Simpan File Log sebagai Artifact Unduhan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-architect-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7
