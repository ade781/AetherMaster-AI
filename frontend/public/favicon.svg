<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <!-- Steel Blade Left Bevel -->
    <linearGradient id="blade_light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <!-- Steel Blade Right Bevel -->
    <linearGradient id="blade_dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="60%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <!-- Gold Guard and Pommel -->
    <linearGradient id="gold_trim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <!-- Grip Leather Wrap -->
    <linearGradient id="grip_leather" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#270e02" />
    </linearGradient>
    <!-- Ruby Core Gem -->
    <radialGradient id="ruby_gem" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="30%" stop-color="#f43f5e" />
      <stop offset="70%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#4c0519" />
    </radialGradient>
    <!-- Aether Amber Drop Shadow / Bloom -->
    <filter id="fantasy_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#fbbf24" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#fantasy_glow)">
    <!-- SWORD 1: Diagonal Top-Left to Bottom-Right (-45 deg) -->
    <g transform="rotate(-45 50 50)">
      <!-- Blade Left Side -->
      <path d="M 50 8 L 47 16 L 47.5 58 L 50 58 Z" fill="url(#blade_light)" />
      <!-- Blade Right Side -->
      <path d="M 50 8 L 53 16 L 52.5 58 L 50 58 Z" fill="url(#blade_dark)" />
      <!-- Fuller / Blood Groove -->
      <line x1="50" y1="18" x2="50" y2="52" stroke="#1e293b" stroke-width="0.8" stroke-linecap="round" />
      
      <!-- Crossguard Wings -->
      <path d="M 50 58 C 42 57, 36 54, 34 52 C 33 55, 36 59, 44 60 L 50 60 Z" fill="url(#gold_trim)" />
      <path d="M 50 58 C 58 57, 64 54, 66 52 C 67 55, 64 59, 56 60 L 50 60 Z" fill="url(#gold_trim)" />
      <circle cx="34" cy="53" r="1.5" fill="url(#gold_trim)" />
      <circle cx="66" cy="53" r="1.5" fill="url(#gold_trim)" />

      <!-- Center Guard Diamond -->
      <polygon points="50,56.5 54,60 50,63.5 46,60" fill="url(#gold_trim)" stroke="#78350f" stroke-width="0.4" />
      <circle cx="50" cy="60" r="1.5" fill="url(#ruby_gem)" />

      <!-- Grip / Hilt -->
      <rect x="48" y="62" width="4" height="22" rx="1" fill="url(#grip_leather)" stroke="#270e02" stroke-width="0.3" />
      <!-- Grip Gold Wire Rings -->
      <line x1="48" y1="66" x2="52" y2="67.5" stroke="url(#gold_trim)" stroke-width="0.75" />
      <line x1="48" y1="71" x2="52" y2="72.5" stroke="url(#gold_trim)" stroke-width="0.75" />
      <line x1="48" y1="76" x2="52" y2="77.5" stroke="url(#gold_trim)" stroke-width="0.75" />
      <line x1="48" y1="81" x2="52" y2="82.5" stroke="url(#gold_trim)" stroke-width="0.75" />

      <!-- Pommel -->
      <circle cx="50" cy="87.5" r="3.5" fill="url(#gold_trim)" stroke="#78350f" stroke-width="0.5" />
      <circle cx="50" cy="87.5" r="1.6" fill="url(#ruby_gem)" />
      <polygon points="48.8,91 51.2,91 50,93.5" fill="url(#gold_trim)" />
    </g>

    <!-- SWORD 2: Diagonal Top-Right to Bottom-Left (+45 deg) -->
    <g transform="rotate(45 50 50)">
      <!-- Blade Left Side -->
      <path d="M 50 8 L 47 16 L 47.5 58 L 50 58 Z" fill="url(#blade_light)" />
      <!-- Blade Right Side -->
      <path d="M 50 8 L 53 16 L 52.5 58 L 50 58 Z" fill="url(#blade_dark)" />
      <!-- Fuller / Blood Groove -->
      <line x1="50" y1="18" x2="50" y2="52" stroke="#1e293b" stroke-width="0.8" stroke-linecap="round" />
      
      <!-- Crossguard Wings -->
      <path d="M 50 58 C 42 57, 36 54, 34 52 C 33 55, 36 59, 44 60 L 50 60 Z" fill="url(#gold_trim)" />
      <path d="M 50 58 C 58 57, 64 54, 66 52 C 67 55, 64 59, 56 60 L 50 60 Z" fill="url(#gold_trim)" />
      <circle cx="34" cy="53" r="1.5" fill="url(#gold_trim)" />
      <circle cx="66" cy="53" r="1.5" fill="url(#gold_trim)" />

      <!-- Center Guard Diamond -->
      <polygon points="50,56.5 54,60 50,63.5 46,60" fill="url(#gold_trim)" stroke="#78350f" stroke-width="0.4" />
      <circle cx="50" cy="60" r="1.5" fill="url(#ruby_gem)" />

      <!-- Grip / Hilt -->
      <rect x="48" y="62" width="4" height="22" rx="1" fill="url(#grip_leather)" stroke="#270e02" stroke-width="0.3" />
      <!-- Grip Gold Wire Rings -->
      <line x1="48" y1="66" x2="52" y2="67.5" stroke="url(#gold_trim)" stroke-width="0.75" />
      <line x1="48" y1="71" x2="52" y2="72.5" stroke="url(#gold_trim)" stroke-width="0.75" />
      <line x1="48" y1="76" x2="52" y2="77.5" stroke="url(#gold_trim)" stroke-width="0.75" />
      <line x1="48" y1="81" x2="52" y2="82.5" stroke="url(#gold_trim)" stroke-width="0.75" />

      <!-- Pommel -->
      <circle cx="50" cy="87.5" r="3.5" fill="url(#gold_trim)" stroke="#78350f" stroke-width="0.5" />
      <circle cx="50" cy="87.5" r="1.6" fill="url(#ruby_gem)" />
      <polygon points="48.8,91 51.2,91 50,93.5" fill="url(#gold_trim)" />
    </g>

    <!-- Center Clash Gleam Spark -->
    <circle cx="50" cy="50" r="2.5" fill="#ffffff" opacity="0.95" />
    <polygon points="50,42 51.8,48.2 58,50 51.8,51.8 50,58 48.2,51.8 42,50 48.2,48.2" fill="url(#gold_trim)" opacity="0.9" />
  </g>
</svg>